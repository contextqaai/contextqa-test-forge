<rect x="306" y="377" width="238" height="49" rx="24" fill="#c4b5fd"/>
<text x="425" y="407" fill="#0b1224" font-size="16" font-weight="700" text-anchor="middle">Review contract / repair</text>
<path d="M 550 402 H 569" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="576" y="377" width="238" height="49" rx="24" fill="#5eead4"/>
<text x="695" y="407" fill="#0b1224" font-size="16" font-weight="700" text-anchor="middle">Reapprove + rerun</text>
<path d="M 820 402 H 839" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="846" y="377" width="238" height="49" rx="24" fill="#fcd34d"/>
<text x="965" y="407" fill="#0b1224" font-size="16" font-weight="700" text-anchor="middle">Retain actual evidence</text>
<text x="36" y="475" fill="#cbd5e1" font-size="16">Export ≠ execution. Mock API examples ≠ live tenant acceptance.</text>
