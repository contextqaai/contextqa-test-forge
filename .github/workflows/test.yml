name: Validate and run synthetic exports
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node examples/demo.js output/ci
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        framework: [playwright, selenium, webdriverio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node examples/demo.js output/ci
      - run: npm install
        working-directory: output/ci/github-${{ matrix.framework }}
      - if: matrix.framework == 'playwright'
        run: npx playwright install --with-deps chromium
        working-directory: output/ci/github-playwright
      - run: npm test
        working-directory: output/ci/github-${{ matrix.framework }}
      - name: Require a deliberately wrong assertion to fail
        run: node scripts/verify-export-failure.js --demo output/ci --framework ${{ matrix.framework }}
      - name: Keep synthetic acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ matrix.framework }}
          retention-days: 3
          path: |
            output/ci/metrics.json
            output/ci/negative-${{ matrix.framework }}-*/result.json
            output/ci/negative-${{ matrix.framework }}-*/runner.log
